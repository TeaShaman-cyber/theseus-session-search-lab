name: Smoke Session Search Arcade inspector

on:
  workflow_dispatch:
    inputs:
      drive_file_id:
        description: Exact private Google Drive shard-bundle file ID
        required: true
        type: string
      expected_bundle_sha256:
        description: Expected bundle SHA-256 from accepted source authority
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: session-search-inspect-${{ inputs.drive_file_id }}
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Arcade SDK
        run: python -m pip install 'arcadepy>=1.7.0,<2'
      - name: Inspect exact Drive bundle
        env:
          ARCADE_URL: ${{ secrets.ARCADE_URL }}
          ARCADE_API_KEY: ${{ secrets.ARCADE_API_KEY }}
          ARCADE_USER_ID: ${{ vars.ARCADE_USER_ID }}
          DRIVE_FILE_ID: ${{ inputs.drive_file_id }}
          EXPECTED_BUNDLE_SHA256: ${{ inputs.expected_bundle_sha256 }}
        run: |
          python scripts/arcade_inspect_bundle.py \
            --drive-file-id "$DRIVE_FILE_ID" \
            --expected-bundle-sha256 "$EXPECTED_BUNDLE_SHA256"
