name: Promote Session Search generation to READY

on:
  workflow_dispatch:
    inputs:
      neon_project_id:
        description: Exact isolated Neon project ID
        required: true
        type: string
      neon_branch_id:
        description: Exact isolated Neon branch ID
        required: true
        type: string
      generation_id:
        description: Exact BUILDING generation ID
        required: true
        type: string
      expected_source_manifest_sha256:
        description: Accepted source manifest SHA-256
        required: true
        type: string
      expected_session_count:
        description: Expected session count
        required: true
        type: string
      expected_message_count:
        description: Expected searchable message count
        required: true
        type: string
      neon_database_name:
        description: Neon database name
        required: true
        default: neondb
        type: string

permissions:
  contents: read

concurrency:
  group: session-search-ready-${{ inputs.neon_project_id }}-${{ inputs.neon_branch_id }}
  cancel-in-progress: false

jobs:
  ready:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Arcade SDK
        run: python -m pip install 'arcadepy>=1.7.0,<2'
      - name: Promote exact generation to READY
        env:
          ARCADE_URL: ${{ secrets.ARCADE_URL }}
          ARCADE_API_KEY: ${{ secrets.ARCADE_API_KEY }}
          ARCADE_USER_ID: ${{ github.actor }}
          NEON_PROJECT_ID: ${{ inputs.neon_project_id }}
          NEON_BRANCH_ID: ${{ inputs.neon_branch_id }}
          GENERATION_ID: ${{ inputs.generation_id }}
          SOURCE_MANIFEST_SHA256: ${{ inputs.expected_source_manifest_sha256 }}
          SESSION_COUNT: ${{ inputs.expected_session_count }}
          MESSAGE_COUNT: ${{ inputs.expected_message_count }}
          DATABASE_NAME: ${{ inputs.neon_database_name }}
        run: |
          python scripts/arcade_mark_bundle_ready.py \
            --neon-project-id "$NEON_PROJECT_ID" \
            --neon-branch-id "$NEON_BRANCH_ID" \
            --generation-id "$GENERATION_ID" \
            --expected-source-manifest-sha256 "$SOURCE_MANIFEST_SHA256" \
            --expected-session-count "$SESSION_COUNT" \
            --expected-message-count "$MESSAGE_COUNT" \
            --neon-database-name "$DATABASE_NAME"
