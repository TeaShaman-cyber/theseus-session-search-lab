name: Transfer Session Search Neon project

on:
  workflow_dispatch:
    inputs:
      source_org_id:
        description: Exact current Neon organization ID
        required: true
        type: string
      destination_org_id:
        description: Exact destination Neon organization ID
        required: true
        type: string
      project_id:
        description: Exact Neon project ID to transfer
        required: true
        type: string
      expected_project_name:
        description: Exact project name expected before and after transfer
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: neon-project-transfer-${{ inputs.project_id }}
  cancel-in-progress: false

jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - name: Transfer exact project with post-readback
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          SOURCE_ORG_ID: ${{ inputs.source_org_id }}
          DESTINATION_ORG_ID: ${{ inputs.destination_org_id }}
          PROJECT_ID: ${{ inputs.project_id }}
          EXPECTED_PROJECT_NAME: ${{ inputs.expected_project_name }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import sys
          import urllib.error
          import urllib.request

          api_key = os.environ.get('NEON_API_KEY', '')
          source_org = os.environ['SOURCE_ORG_ID']
          destination_org = os.environ['DESTINATION_ORG_ID']
          project_id = os.environ['PROJECT_ID']
          expected_name = os.environ['EXPECTED_PROJECT_NAME']

          ident = re.compile(r'^[a-z0-9-]{1,80}$')
          for label, value in (
              ('SOURCE_ORG_ID', source_org),
              ('DESTINATION_ORG_ID', destination_org),
              ('PROJECT_ID', project_id),
          ):
              if not ident.fullmatch(value):
                  raise SystemExit(f'{label}_INVALID')
          if not api_key:
              raise SystemExit('NEON_API_KEY_MISSING')
          if source_org == destination_org:
              raise SystemExit('SOURCE_DESTINATION_SAME')
          if not expected_name or len(expected_name) > 256:
              raise SystemExit('EXPECTED_PROJECT_NAME_INVALID')

          base = 'https://console.neon.tech/api/v2'
          headers = {
              'Authorization': f'Bearer {api_key}',
              'Content-Type': 'application/json',
              'User-Agent': 'theseus-session-search-transfer/1',
          }

          def request(method, path, body=None):
              data = None if body is None else json.dumps(body).encode('utf-8')
              req = urllib.request.Request(base + path, data=data, method=method, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as response:
                  raw = response.read()
                  return response.status, json.loads(raw) if raw else None

          def project_readback():
              status, payload = request('GET', f'/projects/{project_id}')
              if status != 200 or not isinstance(payload, dict):
                  raise SystemExit('PROJECT_READBACK_FAILED')
              project = payload.get('project', payload)
              if project.get('id') != project_id:
                  raise SystemExit('PROJECT_ID_READBACK_MISMATCH')
              if project.get('name') != expected_name:
                  raise SystemExit('PROJECT_NAME_READBACK_MISMATCH')
              return project

          before = project_readback()
          observed_source = before.get('org_id') or before.get('owner_id')
          if observed_source != source_org:
              raise SystemExit(f'PROJECT_SOURCE_ORG_MISMATCH observed={observed_source}')
          print(f'PREFLIGHT_OK project_id={project_id} source_org_id={source_org}')

          body = {
              'destination_org_id': destination_org,
              'project_ids': [project_id],
          }
          transfer_error = None
          try:
              status, _ = request(
                  'POST',
                  f'/organizations/{source_org}/projects/transfer',
                  body,
              )
              if status != 200:
                  raise SystemExit(f'TRANSFER_HTTP_STATUS_{status}')
          except urllib.error.HTTPError as exc:
              # HTTP responses are authoritative failures; print only status/reason.
              raise SystemExit(f'TRANSFER_HTTP_ERROR status={exc.code} reason={exc.reason}') from None
          except (urllib.error.URLError, TimeoutError) as exc:
              # A POST may have committed even if its response was lost. Resolve by readback.
              transfer_error = type(exc).__name__

          after = project_readback()
          observed_destination = after.get('org_id') or after.get('owner_id')
          if observed_destination != destination_org:
              if transfer_error:
                  raise SystemExit(
                      f'TRANSFER_OUTCOME_UNKNOWN network_error={transfer_error} observed_org={observed_destination}'
                  )
              raise SystemExit(f'TRANSFER_POSTCONDITION_FAILED observed_org={observed_destination}')

          print(
              'NEON_PROJECT_TRANSFER_PASS '
              f'project_id={project_id} destination_org_id={destination_org} '
              f'network_reconciled={str(bool(transfer_error)).lower()}'
          )
          PY
