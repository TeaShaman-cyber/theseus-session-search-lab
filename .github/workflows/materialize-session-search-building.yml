name: Materialize Session Search BUILDING

on:
  workflow_dispatch:
    inputs:
      drive_file_id:
        description: Exact private Google Drive shard-bundle file ID
        required: true
        type: string
      expected_bundle_sha256:
        description: Expected bundle SHA-256 from accepted source authority
        required: true
        type: string
      neon_project_id:
        description: Exact isolated Neon project ID
        required: true
        type: string
      neon_branch_id:
        description: Exact isolated Neon branch ID
        required: true
        type: string
      neon_database_name:
        description: Neon database name
        required: true
        default: neondb
        type: string

permissions:
  contents: read

concurrency:
  group: session-search-building-${{ inputs.neon_project_id }}-${{ inputs.neon_branch_id }}
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Arcade SDK
        run: python -m pip install 'arcadepy>=1.7.0,<2'
      - name: Materialize exact bundle as BUILDING
        env:
          ARCADE_URL: ${{ secrets.ARCADE_URL }}
          ARCADE_API_KEY: ${{ secrets.ARCADE_API_KEY }}
          ARCADE_USER_ID: ${{ vars.ARCADE_USER_ID }}
          DRIVE_FILE_ID: ${{ inputs.drive_file_id }}
          EXPECTED_BUNDLE_SHA256: ${{ inputs.expected_bundle_sha256 }}
          NEON_PROJECT_ID: ${{ inputs.neon_project_id }}
          NEON_BRANCH_ID: ${{ inputs.neon_branch_id }}
          NEON_DATABASE_NAME: ${{ inputs.neon_database_name }}
        run: |
          python scripts/arcade_materialize_bundle.py \
            --drive-file-id "$DRIVE_FILE_ID" \
            --expected-bundle-sha256 "$EXPECTED_BUNDLE_SHA256" \
            --neon-project-id "$NEON_PROJECT_ID" \
            --neon-branch-id "$NEON_BRANCH_ID" \
            --neon-database-name "$NEON_DATABASE_NAME"
