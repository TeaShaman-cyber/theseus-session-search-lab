[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "session-search-arcade-materializer"
version = "0.2.0"
description = "Arcade Hosted verifier/materializer for Session Search shard bundles"
requires-python = ">=3.11"
dependencies = [
  "arcade-mcp>=1.16.0",
  "httpx>=0.27.0,<1",
  "psycopg2-binary>=2.9,<3",
]

[tool.setuptools.packages.find]
where = ["src"]
